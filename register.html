<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <section>
      <div class="login-box">
        <form id="registerForm" novalidate>
          <h2>Register</h2>

          <div class="input-box">
            <span class="icon"><ion-icon name="person"></ion-icon></span>
            <input type="text" id="username" required />
            <label>Full Name</label>
            <small class="error-msg"></small>
          </div>

          <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon></span>
            <input type="email" id="email" required />
            <label>Email</label>
            <small class="error-msg"></small>
          </div>

          <div class="input-box">
            <span class="icon"
              ><ion-icon name="lock-open" id="togglePassword"></ion-icon
            ></span>
            <input type="password" id="password" required />
            <label>Password</label>
            <small class="error-msg"></small>
          </div>

          <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
            <input type="password" id="confirmPassword" required />
            <label>Confirm Password</label>
            <small class="error-msg"></small>
          </div>

          <div class="remember-forgot">
            <label
              ><input type="checkbox" id="terms" />I agree to the terms</label
            >
          </div>
          <small class="error-msg terms-error" id="termsError"></small>

          <button type="submit">Register</button>
          <p class="success-msg" id="successMsg"></p>

          <div class="register-link">
            <p>Already have an account? <a href="index.html">Login</a></p>
          </div>
        </form>
      </div>
    </section>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="register.js"></script>
  </body>
</html>
